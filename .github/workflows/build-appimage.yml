name: Build AppImage
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.0-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm install
      - run: npm run build:appimage
      - uses: actions/upload-artifact@v4
        with:
          name: Xbox360-Blockly-AppImage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
